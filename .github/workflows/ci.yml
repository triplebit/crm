# The workflow the previous implementation never had.
#
# It produced 40,000 lines of Go across 25 commits with no job that ran
# `go build` or `go test`. Its only workflow was security scanners, every one of
# them `continue-on-error: true`. Login was broken from the first commit and four
# integration tests failed from the first commit, because nothing would ever have
# noticed.
#
# Therefore: no `continue-on-error`, no `|| true`, no advisory steps in this
# file. A step here either gates the merge or does not belong here. Scanners live
# in a separate workflow and may stay advisory; they must never be the only one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: build, vet, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORTAL_TEST_DATABASE_URL: postgres://portal:portal@127.0.0.1:5432/portal_test?sslmode=disable
      # Turns internal/testdb's t.Skip into t.Fatal. A database test that
      # silently skips in CI is not a test: that is exactly how four integration
      # tests stayed red from the baseline commit onward.
      PORTAL_REQUIRE_DB_TESTS: "1"

    # Actions are pinned to full-length commit SHAs, not tags. A tag is mutable:
    # whoever controls the action's repository can repoint it at new code, which
    # then runs with access to this workflow's token. The organization enforces
    # this, and it is worth keeping regardless. Each SHA was verified against the
    # version named in the trailing comment before being committed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Generated templates are committed so `go build` works without codegen.
      # This proves they are current, using the templ version pinned by go.mod's
      # tool directive rather than a separately pinned binary.
      - name: templ generate
        run: go tool templ generate

      - name: generated templates are current
        run: git diff --exit-code -- '*_templ.go'

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"; echo "$out"; exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: layering
        run: go run ./internal/tools/layercheck

      - name: cookies are written through internal/cookie only
        run: make lint-cookie

      - name: go test
        run: go test -race -count=1 ./...
