# The workflow the previous implementation never had.
#
# It produced 40,000 lines of Go across 25 commits with no job that ran
# `go build` or `go test`. Its only workflow was security scanners, every one of
# them `continue-on-error: true`. Login was broken from the first commit and four
# integration tests failed from the first commit, because nothing would ever have
# noticed.
#
# Therefore: no `continue-on-error`, no `|| true`, no advisory steps in this
# file. A step here either gates the merge or does not belong here — including
# the vulnerability scan, which is a gate, not an advisory sidecar.
#
# Every gating step is `make <target>`. CI re-typing the gates is how CI and
# the local check drift apart, which happened once: CI ran `go build ./...`
# while make built one binary, and six targets never ran in CI at all.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: build, vet, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # make test-db derives PORTAL_TEST_DATABASE_URL from this and sets
      # PORTAL_REQUIRE_DB_TESTS=1 itself, turning internal/testdb's t.Skip
      # into a failure. A database test that silently skips in CI is not a
      # test: that is exactly how four integration tests stayed red from the
      # baseline commit onward.
      TEST_DB_URL: postgres://portal:portal@127.0.0.1:5432/portal_test?sslmode=disable

    # Actions are pinned to full-length commit SHAs, not tags. A tag is mutable:
    # whoever controls the action's repository can repoint it at new code, which
    # then runs with access to this workflow's token. The organization enforces
    # this, and it is worth keeping regardless. Each SHA was verified against the
    # version named in the trailing comment before being committed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: generated templates are current
        run: make generate-check

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: layering
        run: make layercheck

      - name: cookies are written through internal/cookie only
        run: make lint-cookie

      # An enforcement mechanism that has never been observed to fail is not
      # known to work. Plant a known-bad file and require the lint to catch it.
      - name: the cookie lint can fail
        run: |
          echo 'package httpx' > internal/httpx/zz_lint_probe.go
          echo 'import "net/http"' >> internal/httpx/zz_lint_probe.go
          echo 'func zzProbe(w http.ResponseWriter) { w.Header().Set("Set-Cookie", "x=1") }' >> internal/httpx/zz_lint_probe.go
          if make lint-cookie; then
            echo "lint-cookie passed a known-bad probe"; exit 1
          fi
          rm internal/httpx/zz_lint_probe.go

      - name: module graph is verified and tidy
        run: make mod-verify

      - name: go build
        run: make build

      - name: go test (database tests must run, not skip)
        run: make test-db

      - name: govulncheck
        run: make vuln

      - name: compose file is valid
        run: make compose-check

      - name: container image builds
        run: make docker-check
