# Local development stack: PostgreSQL, Pocket ID, migrations, the portal.
#
# One-time setup:
#
#   1. Copy .env.example to .env and follow the comments in it.
#   2. docker compose up -d pocket-id, then open
#      http://pocket-id.localhost:1411/setup and create the admin account
#      (it will register a passkey).
#   3. In the Pocket ID admin UI, create an OIDC client with callback URL
#      http://localhost:8080/auth/callback, and put its ID and secret in .env.
#   4. docker compose up -d
#
# Why "pocket-id.localhost": the browser and the portal container must reach
# Pocket ID by ONE URL (OIDC has a single issuer), and passkey registration
# (WebAuthn) requires a secure context, which plain http only gets on
# localhost names. Chrome and Firefox resolve *.localhost to loopback and
# treat it as secure; inside the compose network the same name is an alias
# for the pocket-id service. Safari and curl need one hosts line:
#     127.0.0.1 pocket-id.localhost
#
# The M3 gate: sign in through Pocket ID and land on /account showing your
# own name, at http://localhost:8080.
# Images are pinned to digests for the same reason GitHub Actions are pinned
# to commit SHAs: a tag is mutable, and whoever controls the registry entry
# can repoint it. The trailing tag comments are documentation; the digest is
# what pulls. Update digests deliberately, the way action SHAs are updated.
services:
  db:
    image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193 # 17-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - db-data:/var/lib/postgresql/data

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id@sha256:f8cde808e8e840acda25683fc2168e0206e3f3fb1a48cca89d211aafd87eaeef # v1 (1.16.0)
    environment:
      APP_URL: http://pocket-id.localhost:1411
      TRUST_PROXY: "false"
    ports:
      - "1411:1411"
    volumes:
      - pocket-id-data:/app/data
    networks:
      default:
        aliases:
          - pocket-id.localhost

  migrate:
    build: .
    image: triplebit-portal
    command: ["migrate"]
    environment:
      PORTAL_DATABASE_URL: postgres://portal:portal@db:5432/portal?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  portal:
    build: .
    image: triplebit-portal
    command: ["serve"]
    ports:
      - "8080:8080"
    environment:
      PORTAL_ENV: development
      PORTAL_BASE_URL: http://localhost:8080
      PORTAL_DATABASE_URL: postgres://portal:portal@db:5432/portal?sslmode=disable
      # ":?" makes compose refuse to start on a missing value, loudly. There
      # are no default keys, in development either: a key that ships in a
      # repository is not a key.
      PORTAL_SESSION_KEY: ${PORTAL_SESSION_KEY:?set in .env — see .env.example}
      PORTAL_SESSION_KEY_ID: ${PORTAL_SESSION_KEY_ID:?set in .env}
      PORTAL_ENCRYPTION_KEY: ${PORTAL_ENCRYPTION_KEY:?set in .env}
      PORTAL_ENCRYPTION_KEY_ID: ${PORTAL_ENCRYPTION_KEY_ID:?set in .env}
      PORTAL_OIDC_ISSUER: http://pocket-id.localhost:1411
      PORTAL_OIDC_CLIENT_ID: ${PORTAL_OIDC_CLIENT_ID:?create the client in Pocket ID first}
      PORTAL_OIDC_CLIENT_SECRET: ${PORTAL_OIDC_CLIENT_SECRET:?create the client in Pocket ID first}
      PORTAL_OIDC_REDIRECT_URL: http://localhost:8080/auth/callback
    depends_on:
      migrate:
        condition: service_completed_successfully
      pocket-id:
        condition: service_started
    # OIDC discovery runs at startup and Pocket ID may still be booting;
    # restarting until it answers is simpler and more honest than a fake
    # readiness probe. Bounded, so a genuinely broken configuration is a
    # visible dead container, not an infinite crash loop that undoes the
    # binary's fail-fast posture.
    restart: on-failure:5

volumes:
  db-data:
  pocket-id-data:
