# Local development stack: PostgreSQL, Pocket ID, migrations, the portal.
#
# One-time setup:
#
#   1. Copy .env.example to .env and follow the comments in it.
#   2. docker compose up -d pocket-id, then open
#      http://pocket-id.localhost:1411/setup and create the admin account
#      (it will register a passkey).
#   3. In the Pocket ID admin UI, create an OIDC client with callback URL
#      http://localhost:8080/auth/callback, and put its ID and secret in .env.
#   4. docker compose up -d
#
# Why "pocket-id.localhost": the browser and the portal container must reach
# Pocket ID by ONE URL (OIDC has a single issuer), and passkey registration
# (WebAuthn) requires a secure context, which plain http only gets on
# localhost names. Chrome and Firefox resolve *.localhost to loopback and
# treat it as secure; inside the compose network the same name is an alias
# for the pocket-id service. Safari and curl need one hosts line:
#     127.0.0.1 pocket-id.localhost
#
# The M3 gate: sign in through Pocket ID and land on /account showing your
# own name, at http://localhost:8080.
# Images are pinned to digests for the same reason GitHub Actions are pinned
# to commit SHAs: a tag is mutable, and whoever controls the registry entry
# can repoint it. The trailing tag comments are documentation; the digest is
# what pulls. Update digests deliberately, the way action SHAs are updated.
services:
  db:
    image: postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15 # 18.4-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      # Postgres 18+ images store data in a major-version-specific
      # subdirectory, so the mount belongs one level up at
      # /var/lib/postgresql. Mounting the old .../data path makes the image
      # refuse to start — which is the correct refusal: it cannot tell a
      # deliberate layout from an image upgraded without pg_upgrade. The
      # single higher mount is also what makes a future pg_upgrade --link
      # possible without crossing a mount boundary.
      - db-data-18:/var/lib/postgresql

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id@sha256:4a277d141d6069fd9a7b321a9aca80f4b9812b8fa122ee566d2f15900e3d8448 # v2.12.0
    environment:
      APP_URL: http://pocket-id.localhost:1411
      TRUST_PROXY: "false"
      # Mandatory from Pocket ID v2: it encrypts its own secrets at rest, and
      # refuses to start without a key of at least 16 characters.
      ENCRYPTION_KEY: ${POCKET_ID_ENCRYPTION_KEY:?set in .env — see .env.example}
    ports:
      - "1411:1411"
    volumes:
      - pocket-id-data:/app/data
    networks:
      default:
        aliases:
          - pocket-id.localhost

  migrate:
    build:
      context: .
      args:
        PORTAL_REVISION: ${PORTAL_REVISION:-unknown}
    image: triplebit-portal
    command: ["migrate"]
    environment:
      PORTAL_DATABASE_URL: postgres://portal:portal@db:5432/portal?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  portal:
    build:
      context: .
      args:
        PORTAL_REVISION: ${PORTAL_REVISION:-unknown}
    image: triplebit-portal
    command: ["serve"]
    ports:
      - "8080:8080"
    environment:
      PORTAL_ENV: development
      PORTAL_BASE_URL: http://localhost:8080
      PORTAL_DATABASE_URL: postgres://portal:portal@db:5432/portal?sslmode=disable
      # ":?" makes compose refuse to start on a missing value, loudly. There
      # are no default keys, in development either: a key that ships in a
      # repository is not a key.
      PORTAL_SESSION_KEY: ${PORTAL_SESSION_KEY:?set in .env — see .env.example}
      PORTAL_SESSION_KEY_ID: ${PORTAL_SESSION_KEY_ID:?set in .env}
      PORTAL_ENCRYPTION_KEY: ${PORTAL_ENCRYPTION_KEY:?set in .env}
      PORTAL_ENCRYPTION_KEY_ID: ${PORTAL_ENCRYPTION_KEY_ID:?set in .env}
      PORTAL_OIDC_ISSUER: http://pocket-id.localhost:1411
      PORTAL_OIDC_CLIENT_ID: ${PORTAL_OIDC_CLIENT_ID:?create the client in Pocket ID first}
      PORTAL_OIDC_CLIENT_SECRET: ${PORTAL_OIDC_CLIENT_SECRET:?create the client in Pocket ID first}
      PORTAL_OIDC_REDIRECT_URL: http://localhost:8080/auth/callback
      PORTAL_STRIPE_SECRET_KEY: ${PORTAL_STRIPE_SECRET_KEY:?set in .env — see .env.example}
      PORTAL_STRIPE_MEMBERSHIPS_ACCOUNT: ${PORTAL_STRIPE_MEMBERSHIPS_ACCOUNT:?set in .env}
      PORTAL_STRIPE_DONATIONS_ACCOUNT: ${PORTAL_STRIPE_DONATIONS_ACCOUNT:?set in .env}
      PORTAL_STRIPE_MEMBERSHIPS_WEBHOOK_SECRET: ${PORTAL_STRIPE_MEMBERSHIPS_WEBHOOK_SECRET:?set in .env — see .env.example}
      PORTAL_STRIPE_DONATIONS_WEBHOOK_SECRET: ${PORTAL_STRIPE_DONATIONS_WEBHOOK_SECRET:?set in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      pocket-id:
        condition: service_started
    # OIDC discovery runs at startup and Pocket ID may still be booting;
    # restarting until it answers is simpler and more honest than a fake
    # readiness probe. Bounded, so a genuinely broken configuration is a
    # visible dead container, not an infinite crash loop that undoes the
    # binary's fail-fast posture.
    restart: on-failure:5

  # The worker is a separate service with a deliberately smaller environment:
  # no session key, no encryption key, no OIDC credentials. It settles orders
  # and releases stale reservations, neither of which needs to read a browser
  # session or decrypt anybody's data — so a compromise of this container
  # cannot do either. That is D7 expressed where it can be checked by reading,
  # and `make compose-check` fails if a secret ever appears in this block.
  #
  # It is not a copy of the portal service with a different command: the
  # difference in this block IS the security boundary.
  worker:
    build:
      context: .
      args:
        PORTAL_REVISION: ${PORTAL_REVISION:-unknown}
    image: triplebit-portal
    command: ["worker"]
    environment:
      PORTAL_ENV: development
      PORTAL_BASE_URL: http://localhost:8080
      PORTAL_DATABASE_URL: postgres://portal:portal@db:5432/portal?sslmode=disable
      PORTAL_STRIPE_SECRET_KEY: ${PORTAL_STRIPE_SECRET_KEY:?set in .env — see .env.example}
      PORTAL_STRIPE_MEMBERSHIPS_ACCOUNT: ${PORTAL_STRIPE_MEMBERSHIPS_ACCOUNT:?set in .env}
      PORTAL_STRIPE_DONATIONS_ACCOUNT: ${PORTAL_STRIPE_DONATIONS_ACCOUNT:?set in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5

volumes:
  # Named for its major version deliberately. Postgres 18 stores data in a
  # major-version subdirectory and refuses to start against a 17 layout, so
  # reusing one volume name across the upgrade would have turned a rollback
  # into a data-loss decision. A 17 volume from an earlier checkout is left
  # untouched under its old name, and `docker volume ls` still shows it.
  #
  # There is no pg_upgrade path here because there is no production data yet
  # (M8 deploys). For a local database worth keeping: dump from 17 with
  # `pg_dump` before switching, then restore into 18. For one that is not,
  # `portal migrate` rebuilds the schema and `catalog-sync` the catalog.
  db-data-18:
  pocket-id-data:
